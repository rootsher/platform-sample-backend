name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
      - run: npm run build

  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep:1.176.0@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e \
            semgrep scan --error --metrics=off \
              --config p/typescript --config p/nodejs --config p/dockerfile

  image:
    needs: [test, scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.PUBLISH == 'true' && format('{0}:main', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Everything below works on the digest, never on a tag. The digest is
      # what gets signed, scanned and later written into platform-delivery.
      - name: sbom
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.PUBLISH == 'true' && format('{0}@{1}', env.IMAGE, steps.build.outputs.digest) || format('{0}:sha-{1}', env.IMAGE, github.sha) }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - name: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.cdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json

      - if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign and attest
        if: env.PUBLISH == 'true'
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"
      - if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: summary
        if: env.PUBLISH == 'true'
        run: echo "${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  # Staging follows main. The digest that was just signed goes to
  # platform-delivery as a pull request that merges itself once that repo's
  # checks pass. Prod is promoted from there, by hand.
  promote:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PROMOTION_APP_ID }}
          private-key: ${{ secrets.PROMOTION_APP_KEY }}
          repositories: platform-delivery
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/platform-delivery
          token: ${{ steps.app.outputs.token }}
      - name: open the staging pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DIGEST: ${{ needs.image.outputs.digest }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          values=environments/staging/sample-backend/values.yaml
          if [[ $(yq '.image.digest' "$values") == "$DIGEST" ]]; then
            echo "staging already runs $DIGEST" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          branch="promote/staging/sample-backend-${GITHUB_SHA:0:12}"
          git switch -c "$branch"
          yq -i ".image.digest = \"$DIGEST\"" "$values"
          git commit -am "feat(staging): deploy sample-backend ${GITHUB_SHA:0:7}"
          git push -u origin "$branch"

          url=$(gh pr create --base main --head "$branch" \
            --title "feat(staging): deploy sample-backend ${GITHUB_SHA:0:7}" \
            --body "Built from $SOURCE.

          \`\`\`
          $DIGEST
          \`\`\`")
          gh pr merge "$url" --auto --squash
